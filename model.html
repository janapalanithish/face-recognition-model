<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Verification System</title>
    <style>
        /* Professional Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h2 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 0.9rem; margin-bottom: 20px; }

        #webcam-container {
            border: 4px solid #e8eaed;
            border-radius: 12px;
            overflow: hidden;
            display: inline-block;
            background: #000;
            margin-bottom: 15px;
            position: relative;
        }

        /* Scanning animation effect */
        #webcam-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(26, 115, 232, 0.5);
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .active#webcam-container::after { display: block; }

        #status-badge {
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
            background: #f1f3f4;
            color: #5f6368;
            transition: all 0.3s ease;
        }

        .detected { background: #e6f4ea !important; color: #1e8e3e !important; border: 1px solid #1e8e3e; }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #1557b0; }

        #label-container {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #9aa0a6;
            text-align: left;
        }

        .probability-bar {
            height: 4px;
            background: #e8eaed;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .probability-fill {
            height: 100%;
            background: #1a73e8;
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Entry System</h2>
    <p id="instruction">Click "Start System" to begin face verification</p>
    
    <div id="webcam-container"></div>
    
    <div id="status-badge">System Offline</div>
    
    <div id="label-container"></div>
    
    <br>
    <button type="button" id="start-btn" onclick="init()">Start System</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/3k23_bDk7/";
    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        document.getElementById("start-btn").style.display = "none";
        document.getElementById("status-badge").innerHTML = "Loading Model...";
        document.getElementById("instruction").innerHTML = "Please look directly at the camera";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(300, 300, flip); 
        await webcam.setup();
        await webcam.play();
        
        document.getElementById("webcam-container").classList.add("active");
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        document.getElementById("status-badge").innerHTML = "Scanning...";
        
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
            const labelDiv = document.createElement("div");
            labelDiv.innerHTML = `<span>${model.getClassLabels()[i]}</span><div class="probability-bar"><div class="probability-fill" id="fill-${i}"></div></div>`;
            labelContainer.appendChild(labelDiv);
        }
        
        window.requestAnimationFrame(loop);
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let highConfidence = false;

        for (let i = 0; i < maxPredictions; i++) {
            const prob = prediction[i].probability;
            const fill = document.getElementById(`fill-${i}`);
            fill.style.width = (prob * 100) + "%";

            // If the model is more than 90% sure
            if (prob > 0.90) {
                const name = prediction[i].className;
                
                // Logic: Don't show "Status" for objects like 'Book' or 'Bottle'
                // Replace 'nithish' with whatever your class name is in Teachable Machine
                if(name.toLowerCase() === "nithish") {
                    document.getElementById("status-badge").innerHTML = "Verified: " + name;
                    document.getElementById("status-badge").classList.add("detected");
                    highConfidence = true;
                } else {
                    document.getElementById("status-badge").innerHTML = "Object: " + name;
                    document.getElementById("status-badge").classList.remove("detected");
                    highConfidence = true;
                }
            }
        }

        if (!highConfidence) {
            document.getElementById("status-badge").innerHTML = "Scanning...";
            document.getElementById("status-badge").classList.remove("detected");
        }
    }
</script>

</body>
</html>
