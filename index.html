<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Smart Entry - Firebase Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Smart Entry System</h1>

        <div id="registration-sector" class="sector">
            <h3>Sector 1: Register New User</h3>
            <p>Type your name and look at the camera to enroll.</p>
            <input type="text" id="user-name" placeholder="Enter Full Name">
            <button id="register-btn">Register My Face</button>
        </div>

        <hr>

        <div id="verification-sector" class="sector">
            <h3>Sector 2: Verification Scanner</h3>
            <div id="video-wrapper">
                <video id="video" width="320" height="240" autoplay muted></video>
            </div>
            <div id="status-badge">System Ready</div>
            <button id="verify-btn">Start Verification</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
