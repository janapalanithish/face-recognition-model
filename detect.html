<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Detection</title>

<link rel="stylesheet" href="styles.css">
</head>

<body class="detect-page">

<nav class="navbar">
    <div class="logo">FaceAI</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
    </div>
</nav>

<div class="detect-container">

    <h1 class="detect-title">AI Smart Entry System</h1>

    <!-- REGISTER -->
    <div class="detect-card">
        <h2>Register New User</h2>
        <p>Enter your name and look at camera</p>

        <input type="text" id="user-name" class="detect-input" placeholder="Enter Full Name">

        <!-- 🔥 ADD THIS BUTTON -->
        <button id="start-camera" class="detect-btn">Start Camera</button>

        <button id="register-btn" class="detect-btn">
            Register My Face
        </button>
    </div>

    <!-- VERIFY -->
    <div class="detect-card">
        <h2>Verification Scanner</h2>

        <div class="video-box">
            <video id="video" autoplay muted></video>
        </div>

        <div id="status-badge" class="status-box">
            Loading...
        </div>

        <button id="verify-btn" class="detect-btn">
            Start Verification
        </button>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <script src="model.js"></script>

</body>
</html>
